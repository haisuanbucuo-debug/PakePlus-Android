<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>ATP网球比分板 专业版</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='90' font-size='90'>🎾</text></svg>" sizes="any">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><text y='160' font-size='160'>🎾</text></svg>">
    <!-- 引入 html2canvas 用于精确截取比分板区域且不包含鼠标 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        html, body {
            background: #0a0a0a;
            color: #f5f5f7;
            width: 100%;
            height: auto;
            overscroll-behavior: none;
            touch-action: pan-y;
        }
        body {
            padding: 24px 20px;
            max-width: 860px;
            margin: 0 auto;
            touch-action: pan-y;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .scoreboard {
            background: #000;
            display: none;
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .setup {
            background: #161618;
            padding: 24px 20px;
            border-radius: 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        .setup input, .setup select {
            width: 48%;
            padding: 13px 14px;
            font-size: 17px;
            background: #1c1c1e;
            border: 1px solid rgba(255,255,255,0.12);
            color: #f5f5f7;
            border-radius: 12px;
            margin: 5px 1%;
            transition: border-color 0.2s;
        }
        .setup input:focus, .setup select:focus { outline: none; border-color: rgba(255,215,0,0.45); }
        .setup input::placeholder { color: #636366; }
        .setup .full-width {
            width: 98%;
            margin: 8px 1%;
            display: inline-block;
        }
        .setup label {
            font-size: 15px;
            font-weight: 500;
            color: #ffd700;
            margin-left: 1%;
            display: inline-block;
            width: 30%;
        }
        .setup .mode-select {
            width: 60%;
        }
        .setup button {
            margin-top: 18px;
            padding: 14px 32px;
            font-size: 17px;
            background: #ffd700;
            color: #000;
            border: none;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .setup button:active { opacity: 0.82; transform: scale(0.97); }
        .setup-btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .language-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .language-btn {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.14);
            background: #1c1c1e;
            color: rgba(255,255,255,0.62);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }
        .language-btn.active {
            background: #ffd700;
            color: #000;
            border-color: #ffd700;
        }

        .player {
            display: flex;
            align-items: center;
            height: 80px;
            border-bottom: 1.5px solid #333;
            position: relative;
        }
        .serve-dot {
            width: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: none;
            background: #ffd700;
        }
        .name {
            width: 180px;
            font-size: 32px;
            font-weight: bold;
            padding-left: 8px;
        }
        .sets {
            display: flex;
            height: 100%;
        }
        .set {
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            position: relative;
        }
        .tiebreak-sup {
            position: absolute; top: 14px; right: 4px;
            font-size: 14px; color: #fff;
        }
        .current-set {
            background: #ffd700; color: #000;
        }
        .past-set { color: #fff; }
        .winner { color: #ffd700; }

        .point-box {
            width: 220px; height: 80px;
            display: flex; align-items: center; justify-content: flex-start; gap: 14px; padding: 0 10px;
        }
        .point-main {
            font-size: 36px; font-weight: bold; color: #fff;
            width: 80px; text-align: center;
        }
        .key-point {
            flex-shrink: 0; width: auto; min-width: 96px;
            font-size: 26px; font-weight: bold; color: #ffd700;
            opacity: 0; transition: opacity 0.3s ease;
            padding: 5px 10px; background: rgba(0,0,0,0.85); border-radius: 4px;
            white-space: nowrap;
            text-align: center;
        }
        .key-point.show { opacity: 1; }
        html[lang="en"] .point-box { width: 330px; }
        html[lang="en"] .key-point {
            min-width: 178px;
            font-size: 24px;
            padding-left: 14px;
            padding-right: 14px;
        }

        .ctrl-wrap { margin-top: 24px; text-align: center; display: none; }
        .ctrl-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 120px minmax(0, 1fr);
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
        }
        .player-ctrl { width: 100%; min-width: 0; padding: 14px 12px; background: #161618; border-radius: 18px; transition: opacity 0.2s; border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
        .player-ctrl.disabled-panel {
            opacity: 1;
        }

        /* W / NW / NL / UE 按钮始终常亮可点击，不受发球方限制 */
        .player-ctrl.disabled-panel .stats-row {
            opacity: 1 !important;
        }

        .player-ctrl.disabled-panel .stats-row .stat-sq-btn {
            opacity: 1 !important;
            pointer-events: auto !important;
            cursor: pointer !important;
        }

        /* 非发球方只降低发球区视觉亮度，统计按钮保持常亮 */
        .player-ctrl.disabled-panel h4,
        .player-ctrl.disabled-panel .serve-grid {
            opacity: 0.6;
        }
        .ctrl-middle {
            width: 120px; display: flex; flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding-top: 0;
            margin-top: 0;
        }
        .ctrl-middle-spacer {
            /* matches h4 (approx 21px line-height + 8px margin) + stats-row height (approx 80px) = ~109px */
            height: 109px;
            display: flex;
            align-items: flex-end;
            width: 100%;
            justify-content: center;
        }
        .net-rate-panel {
            background: #1c1c1e;
            border-radius: 14px; padding: 12px 8px; width: 100%;
            text-align: center; border: 1px solid rgba(255,215,0,0.18);
            margin-top: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            overflow-wrap: anywhere;
        }
        .net-rate-panel div { font-size: 13px; margin: 5px 0; color: #ffd700; }
        html[lang="en"] .net-rate-panel div { font-size: 12px; line-height: 1.25; }
        .net-rate-value { font-weight: 700; font-size: 16px; color: #f5f5f7; }
        /* 全新四合一统计按钮组 (W, NW, NL, UE) */
        .stats-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 18px;
        }
        .stat-sq-btn {
            flex: 1;
            background: #2a2a2a;
            border: none;
            border-radius: 16px;
            padding: 12px 4px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.1s linear;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .stat-sq-btn span:first-child {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        .stat-sq-btn .stat-count {
            font-size: 24px;
            font-weight: 800;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            width: 100%;
            border-radius: 20px;
            padding: 2px 0;
        }
        .stat-sq-btn.btn-w-style { background: #9333ea; }
        .stat-sq-btn.btn-nw-style { background: #28a745; }
        .stat-sq-btn.btn-nl-style { background: #c62828; }
        .stat-sq-btn.btn-ue-style { background: #38bdf8; }
        .stat-sq-btn:active { transform: scale(0.96); }

        /* 发球相关按钮网格 (两行四列，正方形风格) */
        .serve-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }
        .grid-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .square-btn {
            aspect-ratio: 1 / 1;
            width: 100%;
            background: #2c2c2e;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            line-height: 1.22;
            padding: 6px 4px;
            text-align: center;
            transition: 0.08s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.45);
        }
        html[lang="en"] .square-btn {
            font-size: 16px;
            line-height: 1.18;
            padding: 6px 3px;
        }
        .square-btn:active { transform: scale(0.94); opacity: 0.88; }
        .square-btn:disabled { opacity: 0.38; transform: none; cursor: not-allowed; }
        .btn-ace-special {
            background: #ff69b4;
        }
        .btn-ace-special small {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.9;
        }
        html[lang="en"] .btn-ace-special small {
            font-size: 12px;
        }
        .btn-gray-mid { background: #666666; }
        .btn-green-serve { background: #28a745; }
        .btn-red-serve { background: #dc3434; }
        /* 双误按钮颜色改为与一发失误相同的灰色 */
        .btn-df { background: #666666; }

        .btn-undo {
            width: 70px; height: 50px;
            background: #ff9800; color: #fff;
            border-radius: 14px; border: none;
            font-weight: 700; cursor: pointer; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(255,152,0,0.28);
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn-undo:active { opacity: 0.82; transform: scale(0.96); }
        .sub-controls {
            display: flex; gap: 10px; justify-content: center;
            margin-bottom: 24px; flex-wrap: wrap;
        }
        .small-btn {
            padding: 11px 18px; font-size: 15px; font-weight: 500;
            background: #2c2c2e; color: #f5f5f7;
            border: none; border-radius: 12px;
            cursor: pointer; touch-action: manipulation;
            transition: opacity 0.15s, transform 0.1s;
        }
        .small-btn:active { opacity: 0.75; transform: scale(0.97); }
        .switch-mode-btn {
            background: #ff9800;
            color: #000;
            font-weight: 700;
        }
        .record-btn {
            background: #e91e63;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }
        .record-btn.recording {
            background: #f44336;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; background-color: #b71c1c; }
            100% { opacity: 0.8; }
        }
        .stats-table {
            margin-top:20px; width:100%; border-collapse:collapse;
            background:#111; border-radius:8px; overflow:hidden;
        }
        .stats-table th,.stats-table td {
            padding:12px; text-align:center; border:1px solid #333; font-size:16px;
        }
        .stats-table th { background:#222; color:#ffd700; }
        .stats-table td { color:#fff; vertical-align:top; }
        
        body.lock-scroll {
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }
        /* 需求1：隐藏日期和模式状态栏 */
        .match-info {
            display: none !important;
        }
        .match-finished-badge {
            background: #b91c1c;
            padding: 2px 8px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        @media (max-width: 550px) {
            .square-btn { font-size: 11px; }
            .stat-sq-btn .stat-count { font-size: 18px; }
            .stat-sq-btn span:first-child { font-size: 16px; }
        }
        @media (max-width: 760px) {
            .ctrl-container {
                grid-template-columns: 1fr;
            }
            .ctrl-middle {
                width: 100%;
                max-width: 260px;
                margin: 0 auto;
            }
            .ctrl-middle-spacer {
                height: auto;
            }
            .net-rate-panel {
                margin-top: 0;
            }
        }
        /* 隐藏 NW/NL 按钮的辅助类 */
        .btn-hidden {
            display: none !important;
        }

        .atp-panel {
            margin-top: 20px; background: #161618;
            border-radius: 18px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 4px 20px rgba(0,0,0,0.45);
        }
        .atp-panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; background: #1c1c1e;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .atp-ph-name {
            font-size: 15px;
            font-weight: 900;
            color: #ffd700;
            width: 36%;
        }
        .atp-ph-name.right { text-align: right; }
        /* 修改: STATS 文字改为白色 */
        .atp-ph-center {
            font-size: 11px;
            color: #ffffff !important;
            text-align: center;
            width: 28%;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .atp-stat-row {
            padding: 10px 18px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .atp-stat-row:last-child { border-bottom: none; }
        .atp-stat-row.net-hidden { display: none; }
        .atp-vals {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 5px;
        }
        /* 双方数据统计数字强制为白色 (符合需求2) */
        .atp-panel .atp-v-a,
        .atp-panel .atp-v-b,
        .atp-panel .atp-v-a .atp-sub,
        .atp-panel .atp-v-b .atp-sub {
            color: #ffffff !important;
        }
        .atp-v-a {
            width: 36%;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.3;
        }
        /* 修改: 数据名称标签文字强制白色（ACE、双误、制胜分等） */
        .atp-v-label {
            width: 28%;
            text-align: center;
            font-size: 11px;
            color: #ffffff !important;
            font-weight: bold;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }
        .atp-v-b {
            width: 36%;
            text-align: right;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.3;
        }
        .atp-bar {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
            display: flex;
            overflow: hidden;
        }
        .atp-bar-half {
            width: 50%;
            display: flex;
        }
        .atp-bar-half.left { justify-content: flex-end; }
        .atp-bar-half.right { justify-content: flex-start; }
        .atp-fill-a {
            height: 6px;
            background: linear-gradient(to left, #4fc3f7, #0d6ea8);
            border-radius: 3px 0 0 3px;
            transition: width 0.3s ease;
            min-width: 1px;
        }
        .atp-fill-b {
            height: 6px;
            background: linear-gradient(to right, #ef5350, #a01010);
            border-radius: 0 3px 3px 0;
            transition: width 0.3s ease;
            min-width: 1px;
        }
        .atp-sub {
            font-size: 10px;
            color: #aaaaaa;
            font-weight: normal;
        }
        .font-ctrl-group {
            display: flex; gap: 14px; align-items: center; justify-content: center;
            background: #1c1c1e; padding: 13px 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .font-ctrl-btn {
            background: #ffd700; border: none; color: #000; font-weight: 700;
            font-size: 17px; width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            transition: opacity 0.15s, transform 0.1s; touch-action: manipulation;
            box-shadow: 0 2px 6px rgba(255,215,0,0.2);
        }
        .font-ctrl-btn:active { opacity: 0.8; transform: scale(0.92); }
        .font-size-value {
            font-size: 15px; color: #ffd700; min-width: 46px;
            text-align: center; font-weight: 600;
        }
        /* 导出专用临时克隆样式：保证截图整洁 */
        .export-clone-container {
            background-color: #000000;
            padding: 24px 20px;
            width: 860px;
            margin: 0 auto;
        }
        /* 统计表格上方日期显示专用样式 */
        .stats-date-header {
            color: #ffffff;
            text-align: center;
            padding: 8px 0;
            background: #0a0a0a;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* ── h4 in ctrl panels ── */
        .player-ctrl h4 {
            font-size: 13px; font-weight: 600;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.6px; text-transform: uppercase;
            margin-bottom: 14px; padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .stat-sq-btn { border-radius: 14px !important; }

        /* ═══════ SCOREBOARD THEMES ═══════ */
        /* ATP (default) */
        .theme-atp .player { border-bottom-color: #333; }
        .theme-atp .current-set { background: #ffd700; color: #000; }
        .theme-atp .past-set { color: #fff; }
        .theme-atp .winner { color: #ffd700; }
        .theme-atp .point-main { color: #fff; }
        .theme-atp .dot { background: #ffd700; }
        .theme-atp .key-point { color: #ffd700; background: rgba(0,0,0,0.85); }

        /* Australian Open */
        .theme-ao { background: #003DA5 !important; }
        .theme-ao .player { border-bottom-color: rgba(255,255,255,0.18); }
        .theme-ao .name { color: #fff; font-weight: 900; }
        .theme-ao .current-set { background: #00d4e8 !important; color: #003DA5 !important; font-weight: 900; }
        .theme-ao .past-set { color: rgba(255,255,255,0.85); }
        .theme-ao .winner { color: #00d4e8; }
        .theme-ao .point-main { color: #fff; }
        .theme-ao .dot { background: #00d4e8; }
        .theme-ao .key-point { color: #003DA5; background: #00d4e8; font-weight: 900; }
        .theme-ao .tiebreak-sup { color: rgba(255,255,255,0.8); }

        /* Roland Garros */
        .theme-rg { background: #1e1e1e !important; border-bottom: 3px solid #C04000 !important; }
        .theme-rg .player { border-bottom-color: rgba(255,255,255,0.12); }
        .theme-rg .name { color: #fff; font-weight: 900; }
        .theme-rg .current-set { background: #C04000 !important; color: #fff !important; font-weight: 900; }
        .theme-rg .past-set { color: rgba(255,255,255,0.8); }
        .theme-rg .winner { color: #e86030; }
        .theme-rg .point-main { color: #fff; }
        .theme-rg .dot { background: #e86030; }
        .theme-rg .key-point { color: #fff; background: #C04000; font-weight: 900; }
        .theme-rg .tiebreak-sup { color: rgba(255,255,255,0.8); }

        /* Wimbledon */
        .theme-wim { background: #1B5E20 !important; border-bottom: 3px solid #6A0DAD !important; }
        .theme-wim .player { border-bottom-color: rgba(255,255,255,0.15); }
        .theme-wim .name { color: #fff; font-weight: 900; }
        .theme-wim .current-set { background: #6A0DAD !important; color: #fff !important; font-weight: 900; }
        .theme-wim .past-set { color: rgba(255,255,255,0.85); }
        .theme-wim .winner { color: #b39ddb; }
        .theme-wim .point-main { color: #fff; }
        .theme-wim .dot { background: #b39ddb; }
        .theme-wim .key-point { color: #fff; background: #6A0DAD; font-weight: 900; }
        .theme-wim .tiebreak-sup { color: rgba(255,255,255,0.8); }

        /* US Open */
        .theme-uso { background: #0B1A3B !important; border-bottom: 3px solid #1565C0 !important; }

// ----- 新增：根据一发/二发阶段精准控制发球按钮禁用状态 (修复一发失误后按钮状态) -----
function updateServeButtonsState(player) {
    // player: 'A' 或 'B'
    const panel = document.getElementById(`playerCtrl${player}`);
    if (!panel) return;
    const isServing = (server === player);
    // 如果当前不是发球方，整个面板应处于禁用状态（由 syncPanelsByServer 处理 opacity 和 pointer-events，但按钮需要真正 disabled）
    // 为了精确，无论是否发球方，我们都设置按钮的 disabled 属性
    const phase = (player === 'A') ? servePhaseA : servePhaseB;
    // 获取该面板中 .serve-grid 下的所有按钮 (共8个)
    const serveGrid = panel.querySelector('.serve-grid');
    if (!serveGrid) return;
    const btns = serveGrid.querySelectorAll('.square-btn');
    if (btns.length !== 8) return;
    // 索引：0:一发ACE, 1:一发失误, 2:一发得分, 3:一发丢分, 4:二发ACE, 5:双误, 6:二发得分, 7:二发丢分
    // 一发相关按钮: 0,2,3  (一发失误按钮永远可点，但应根据发球方和比赛状态)
    // 二发相关按钮: 4,5,6,7
    const isMyServe = (server === player);
    if (!isMyServe || matchFinished) {
        // 非发球方或比赛结束，所有按钮禁用
        btns.forEach(btn => btn.disabled = true);
        return;
    }
    // 是发球方且比赛未结束
    if (phase === 1) {
        // 一发阶段：一发相关按钮启用（包含一发ACE、一发得分、一发丢分），一发失误按钮启用；二发相关按钮全部禁用
        btns[0].disabled = false;  // 一发ACE
        btns[1].disabled = false;  // 一发失误 (始终可点)
        btns[2].disabled = false;  // 一发得分
        btns[3].disabled = false;  // 一发丢分
        btns[4].disabled = true;   // 二发ACE
        btns[5].disabled = true;   // 双误
        btns[6].disabled = true;   // 二发得分
        btns[7].disabled = true;   // 二发丢分
    } else { // phase === 2
        // 二发阶段：一发相关按钮全部禁用，二发相关按钮全部启用
        btns[0].disabled = true;
        btns[1].disabled = false;  // 一发失误理论上已经不会出现（因为已经二发），但保持可点不会有副作用（再次点击会重复记一发失误？需要避免，但逻辑上serveFault内部会判断phase并增加二发次数，应加保护。但为了安全，一发失误按钮在二发阶段也应禁用，避免重复错误统计）
        btns[1].disabled = true;   // 二发阶段不应再点“一发失误”，禁用
        btns[2].disabled = true;
        btns[3].disabled = true;
        btns[4].disabled = false;  // 二发ACE
        btns[5].disabled = false;  // 双误
        btns[6].disabled = false;  // 二发得分
        btns[7].disabled = false;  // 二发丢分
    }
}

// 修改 syncPanelsByServer，保留原有面板禁用样式，同时调用精确按钮状态更新
function syncPanelsByServer() {
    if(matchFinished) return;
    const panelA = document.getElementById('playerCtrlA');
    const panelB = document.getElementById('playerCtrlB');
    const isServerA = (server === 'A');
    // 设置面板透明度样式（视觉反馈）
    if (isServerA) {
        panelA.classList.remove('disabled-panel');
        panelB.classList.add('disabled-panel');
    } else {
        panelB.classList.remove('disabled-panel');
        panelA.classList.add('disabled-panel');
    }
    // 更新按钮禁用状态
    updateServeButtonsState('A');
    updateServeButtonsState('B');
}

// 修改导出图片文件名：日期-球员名 (格式: YYYY-MM-DD_球员A_vs_球员B.jpg)
async function exportScoreboardStatsImage() {
    if (!document.getElementById('scoreboard') || document.getElementById('scoreboard').style.display !== 'block') {
        alert(tr('needStartExport'));
        return;
    }
    const originalScoreboard = document.getElementById('scoreboard');
    const originalAtpPanel = document.querySelector('.atp-panel');
    if (!originalScoreboard || !originalAtpPanel) return;
    
    const cloneScoreboard = originalScoreboard.cloneNode(true);
    const cloneAtpPanel = originalAtpPanel.cloneNode(true);
    const fontGroup = cloneAtpPanel.querySelector('.font-ctrl-group');
    if (fontGroup) fontGroup.remove();
    
    const container = document.createElement('div');
    container.className = 'export-clone-container';
    container.style.backgroundColor = '#000000';
    container.style.padding = '20px';
    container.style.width = '860px';
    container.style.margin = '0 auto';
    container.appendChild(cloneScoreboard);
    container.appendChild(cloneAtpPanel);
    
    container.style.position = 'fixed';
    container.style.left = '-9999px';
    container.style.top = '0';
    container.style.zIndex = '-9999';
    document.body.appendChild(container);
    
    try {
        const canvas = await html2canvas(container, {
            scale: 3,
            backgroundColor: '#000000',
            logging: false,
            useCORS: false,
            allowTaint: false
        });
        const targetWidth = 3000;
        const targetHeight = 4000;
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = targetWidth;
        finalCanvas.height = targetHeight;
        const ctx = finalCanvas.getContext('2d');
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, targetWidth, targetHeight);
        
        const srcW = canvas.width;
        const srcH = canvas.height;
        const scaleW = targetWidth / srcW;
        const scaleH = targetHeight / srcH;
        const scale = Math.min(scaleW, scaleH);
        const drawW = srcW * scale;
        const drawH = srcH * scale;
        const offsetX = (targetWidth - drawW) / 2;
        const offsetY = (targetHeight - drawH) / 2;
        ctx.drawImage(canvas, offsetX, offsetY, drawW, drawH);
        
        // ---- 自动命名：日期-球员名 ----
        let dateStr = document.getElementById('matchDate').value;
        if (!dateStr) {
            const today = new Date();
            dateStr = today.toISOString().slice(0,10);
        }
        // 清理文件名非法字符
        const safeNameA = playerAName.replace(/[/:*?"<>|]/g, '');
        const safeNameB = playerBName.replace(/[\\/:*?"<>|]/g, '');
        const fileName = `${dateStr}_${safeNameA}_vs_${safeNameB}.jpg`;
        
        finalCanvas.toBlob((blob) => {
            if (blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } else {
                alert(tr('imageFail'));
            }
        }, 'image/jpeg', 0.92);
    } catch (err) {
        console.error(err);
        alert(tr('exportFail'));
    } finally {
        if (container && container.parentNode) container.parentNode.removeChild(container);
    }
}

function secondLose(who){ if(matchFinished)return; saveSnap(); who==='A'?secondLoseA++:secondLoseB++; resetServePhase(who); let opp=who==='A'?'B':'A'; addPointDirect(opp); }
function enterTiebreak(){ if(matchFinished) return; saveSnap(); inTie = true; tieA = 0; tieB = 0; tiePointNum = 0; updateTiebreakTarget(); const tiebreakFirstServer = server === 'A' ? 'B' : 'A'; tiebreakFirstReceiver = tiebreakFirstServer === 'A' ? 'B' : 'A'; server = tiebreakFirstServer; renderBoard(); syncPanelsByServer(); }
function recordPrePointKeyStats(who) {
    if (pA === 2 && pB === 2) {
        thirtyThirtyOppA++;
        thirtyThirtyOppB++;
        who === 'A' ? thirtyThirtyWonA++ : thirtyThirtyWonB++;
    }
    if (pA >= 3 && pB >= 3 && pA === pB) {
        deuceOppA++;
        deuceOppB++;
        who === 'A' ? deuceWonA++ : deuceWonB++;
    }
}
function recordLoveGame(gameWinner) {
    const loserPoint = gameWinner === 'A' ? pB : pA;
    if (loserPoint !== 0) return;
    if (gameWinner === server) gameWinner === 'A' ? loveHoldA++ : loveHoldB++;
    else gameWinner === 'A' ? loveBreakA++ : loveBreakB++;
}
function addPointDirect(who){ if(matchFinished)return; who === 'A' ? currentSetPointsA++ : currentSetPointsB++; if(!inTie){ recordPrePointKeyStats(who); let receiver = server==='A' ? 'B' : 'A'; if(getActiveBreakPoints(receiver) > 0) receiver==='A' ? breakPointTotalA++ : breakPointTotalB++; who === 'A' ? pA++ : pB++; checkGameWin(); } else{ who === 'A' ? tieA++ : tieB++; autoTieServeAndSide(); checkTiebreak(); } renderBoard(); updateStats(); }
function getActiveBreakPoints(receiver) {
    const receiverPoint = receiver === 'A' ? pA : pB;
    const serverPoint = receiver === 'A' ? pB : pA;
    if (receiverPoint < 3) return 0;
    if (receiverPoint === 3 && serverPoint < 3) return 3 - serverPoint;
    if (receiverPoint >= 3 && serverPoint >= 3 && receiverPoint > serverPoint) return 1;
    return 0;
}
function checkBreakPointRule() { let receiver = server==='A' ? 'B' : 'A'; let num = getActiveBreakPoints(receiver); if(num > lastCalcBreakPoint){ let add = num - lastCalcBreakPoint; receiver==='A' ? breakPointTotalA+=add : breakPointTotalB+=add; } lastCalcBreakPoint = num; }
function checkGameWin(){ let gameWinner = null; if(pA >=4 && pA - pB >=2){ gameWinner = 'A'; gA++; } else if(pB >=4 && pB - pA >=2){ gameWinner = 'B'; gB++; } if(gameWinner){ recordLoveGame(gameWinner); lastSetLastGameServer = server; serviceGames.push({server:server, winner:gameWinner}); if(gameWinner !== server) gameWinner==='A' ? breakCountA++ : breakCountB++; swapServer(); resetPointData(); lastCalcBreakPoint = 0; resetServePhase(); checkSetWin(); syncPanelsByServer(); } }
function checkSetWin() { if( (gA>=6 && gA-gB>=2) || (gB>=6 && gB-gA>=2) ){ setScores.push({a:currentSetPointsA, b:currentSetPointsB}); setList.push({a:gA, b:gB, ta:0, tb:0, stats:captureStatsSnap()}); handleSetServeRule(); gA=0; gB=0; resetPointData(); inTie = false; tieA=0; tieB=0; currentSetPointsA=0; currentSetPointsB=0; tiePointNum = 0; resetServePhase(); if(checkMatchCompletion()) { renderBoard(); return; } } else if(gA ===6 && gB ===6){ updateTiebreakTarget(); inTie = true; tieA=0; tieB=0; tiePointNum = 0; tiebreakFirstReceiver = server === 'A' ? 'B' : 'A'; syncPanelsByServer(); } }
function checkTiebreak(){ let target = tiebreakTargetScore; if( (tieA>=target && tieA-tieB>=2) || (tieB>=target && tieB-tieA>=2) ){ let tieWinner = tieA>tieB ? 'A' : 'B'; tieWinner==='A' ? gA++ : gB++; lastSetLastGameServer = server; setScores.push({a:currentSetPointsA, b:currentSetPointsB}); setList.push({a:gA, b:gB, ta:tieA, tb:tieB, stats:captureStatsSnap()}); handleSetServeRule(); gA=0; gB=0; resetPointData(); inTie = false; tieA=0; tieB=0; currentSetPointsA=0; currentSetPointsB=0; tiePointNum = 0; resetServePhase(); checkMatchCompletion(); } }
function handleSetServeRule(){ const lastSet = setList[setList.length - 1]; if(lastSet && (lastSet.ta > 0 || lastSet.tb > 0)){ server = tiebreakFirstReceiver ? tiebreakFirstReceiver : (server === 'A' ? 'B' : 'A'); } else { server = lastSetLastGameServer === 'A' ? 'B' : 'A'; } tiebreakFirstReceiver = null; lastSetLastGameServer = null; syncPanelsByServer(); }
function swapServer(){ server = server === 'A' ? 'B' : 'A'; syncPanelsByServer(); }
function resetServePhase(who = null){ if (who === 'A' || who === null) servePhaseA = 1; if (who === 'B' || who === null) servePhaseB = 1; syncPanelsByServer(); }
function autoTieServeAndSide(){ if(!inTie) return; tiePointNum++; if(tiePointNum === 1) server = server === 'A' ? 'B' : 'A'; else if(tiePointNum > 1 && (tiePointNum - 1) % 2 === 0) server = server === 'A' ? 'B' : 'A'; syncPanelsByServer(); }
function updateTiebreakTarget() { if(!useSuperTiebreakForDeciding) { tiebreakTargetScore = 7; return; } let currentSetNumber = setList.length + 1; let decidingSetNumber = (maxWins === 99) ? 99 : (maxWins * 2 - 1); let isDecidingSet = (maxWins !== 99 && currentSetNumber === decidingSetNumber); if(isDecidingSet && decidingSetRule === "super") tiebreakTargetScore = 10; else tiebreakTargetScore = 7; }
function getSetsWon() { let winsA=0,winsB=0; for(let s of setList) { if(s.a > s.b) winsA++; else if(s.b > s.a) winsB++; } return { winsA, winsB }; }
function checkMatchCompletion() { if(matchFinished) return true; let { winsA, winsB } = getSetsWon(); if(winsA >= maxWins) { matchFinished = true; matchWinner = 'A'; } else if(winsB >= maxWins) { matchFinished = true; matchWinner = 'B'; } if(matchFinished) { let badge = document.getElementById("matchWinnerBadge"); if(badge) { badge.style.display = "inline-block"; let winnerName = matchWinner === 'A' ? playerAName : playerBName; badge.innerHTML = tr('winnerBadge')(winnerName); } disableAllMatchControls(true); return true; } return false; }
function getPointStr(self,opp){ if(self <4) return [0,15,30,40][self]; if(self === opp) return '40'; if(self - opp ===1) return 'AD'; return '40'; }
// ── 录屏功能：1080p 稳定模式，适合长时间录制比分板区域 ──────────────────────
let isRecording = false;
let _mediaRecorder = null;
let _recordedChunks = [];
let _recordingCanvas = null;
let _canvasStream = null;
let _recordingAnimId = null;
let _recordingTimerId = null;

async function startRealRecording() {
    if (isRecording) return;
    const scoreboardElem = document.getElementById('scoreboard');
    if (!scoreboardElem) { alert(tr('scoreboardMissing')); return; }

    const TARGET_W = 1920;
    const TARGET_H = 1080;
    const TARGET_FPS = 8;
    const FRAME_INTERVAL_MS = 250;
    const VIDEO_BITRATE = 2000000;
    const canvas = document.createElement('canvas');
    canvas.width = TARGET_W;
    canvas.height = TARGET_H;
    _recordingCanvas = canvas;

    const stream = canvas.captureStream(TARGET_FPS);
    _canvasStream = stream;

    // 选择最佳编码格式
    const mimeTypes = [
        'video/webm;codecs=h264',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm',
        'video/mp4'
    ];
    let chosenMime = '';
    for (const mt of mimeTypes) {
        if (MediaRecorder.isTypeSupported(mt)) { chosenMime = mt; break; }
    }

    const options = chosenMime ? { mimeType: chosenMime, videoBitsPerSecond: VIDEO_BITRATE } : { videoBitsPerSecond: VIDEO_BITRATE };
    _mediaRecorder = new MediaRecorder(stream, options);
    _recordedChunks = [];
    _mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) _recordedChunks.push(e.data); };
    _mediaRecorder.onstop = () => {
        const ext = chosenMime.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(_recordedChunks, { type: chosenMime || 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        // 文件命名：日期+姓名+比分板
        let dateStr = document.getElementById('matchDate') ? document.getElementById('matchDate').value : '';
        if (!dateStr) { const t = new Date(); dateStr = t.toISOString().slice(0,10); }
        dateStr = dateStr.replace(/-/g, '');
        const safeA = playerAName.replace(/[\/:*?"<>|\s]/g, '');
        const safeB = playerBName.replace(/[\/:*?"<>|\s]/g, '');
        a.download = `${dateStr}_${safeA}_vs_${safeB}_比分板.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        _recordedChunks = [];
        _recordingCanvas = null;
        _canvasStream = null;
    };
    _mediaRecorder.start(1000);
    isRecording = true;

    const recordBtn = document.getElementById('recordScreenBtn');
    if (recordBtn) { recordBtn.innerText = tr('stopRecording'); recordBtn.classList.add('recording'); }

    // 持续绘制帧到 canvas
    async function drawFrame() {
        if (!isRecording || !_recordingCanvas) return;
        const elem = document.getElementById('scoreboard');
        if (!elem) return;
        try {
            const ctx = _recordingCanvas.getContext('2d');
            const screenshot = await html2canvas(elem, {
                scale: 2,
                backgroundColor: '#000000',
                logging: false,
                useCORS: false
            });
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, TARGET_W, TARGET_H);
            // 居中缩放放入1080p画布
            const srcW = screenshot.width;
            const srcH = screenshot.height;
            const scale = Math.min(TARGET_W / srcW, TARGET_H / srcH);
            const dw = srcW * scale;
            const dh = srcH * scale;
            const dx = (TARGET_W - dw) / 2;
            const dy = (TARGET_H - dh) / 2;
            ctx.drawImage(screenshot, dx, dy, dw, dh);
        } catch(e) { console.warn('录屏帧绘制失败:', e); }
        if (isRecording) {
            _recordingTimerId = setTimeout(drawFrame, FRAME_INTERVAL_MS);
        }
    }
    if (_recordingAnimId) cancelAnimationFrame(_recordingAnimId);
    if (_recordingTimerId) clearTimeout(_recordingTimerId);
    _recordingTimerId = null;
    drawFrame();
}

async function stopRecordingAndSave(saveFile = true) {
    if (!isRecording) return;
    isRecording = false;
    if (_recordingAnimId) { cancelAnimationFrame(_recordingAnimId); _recordingAnimId = null; }
    if (_recordingTimerId) { clearTimeout(_recordingTimerId); _recordingTimerId = null; }
    if (_canvasStream) { _canvasStream.getTracks().forEach(t => t.stop()); }
    if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
        if (saveFile) {
            _mediaRecorder.stop(); // onstop 触发保存
        } else {
            _mediaRecorder.ondataavailable = null;
            _mediaRecorder.onstop = null;
            _mediaRecorder.stop();
            _recordedChunks = [];
            _recordingCanvas = null;
            _canvasStream = null;
        }
    }
    const recordBtn = document.getElementById('recordScreenBtn');
    if (recordBtn) { recordBtn.innerText = tr('startRecording'); recordBtn.classList.remove('recording'); }
}

async function toggleScreenRecording() {
    if (isRecording) {
        await stopRecordingAndSave(true);
    } else {
        if (matchFinished) { alert(tr('recordingAfterFinish')); return; }
        if (!document.getElementById('scoreboard') || document.getElementById('scoreboard').style.display !== 'block') {
            alert(tr('recordingNeedStart')); return;
        }
        await startRealRecording();
    }
}

// ── 复制文字版统计到剪贴板 ──────────────────────────────────
function copyStatsToClipboard() {
    // 获取比赛日期
    const dateEl = document.getElementById('matchDate');
    const dateStr = dateEl ? dateEl.value : '';

    // 盘分
    let setsStr = '';
    const allSets = [...setScores];
    if (currentSetPointsA > 0 || currentSetPointsB > 0) allSets.push({ a: currentSetPointsA, b: currentSetPointsB });
    if (setList.length > 0) {
        setList.forEach((s, i) => {
            setsStr += `  ${tr('setN')(i+1)}: ${s.a}-${s.b}`;
            if (s.ta || s.tb) setsStr += ` (${tr('tiebreakScore')} ${s.ta}-${s.tb})`;
            setsStr += '\n';
        });
    }
    if (gA > 0 || gB > 0) setsStr += `  ${tr('currentSet')}: ${gA}-${gB}\n`;

    // 发球统计
    const fAceA = firstAceCountA, fAceB = firstAceCountB;
    const fTotA = firstWinA + firstLoseA + serveFaultCountA;
    const fTotB = firstWinB + firstLoseB + serveFaultCountB;
    const fInA = firstWinA + firstLoseA;
    const fInB = firstWinB + firstLoseB;
    const firstInRA = fTotA > 0 ? Math.round(fInA/fTotA*100) : 0;
    const firstInRB = fTotB > 0 ? Math.round(fInB/fTotB*100) : 0;
    const firstWinRA = fInA > 0 ? Math.round(firstWinA/fInA*100) : 0;
    const firstWinRB = fInB > 0 ? Math.round(firstWinB/fInB*100) : 0;
    const sAceA = secondAceCountA, sAceB = secondAceCountB;
    const sTotA = secondWinA + secondLoseA + doubleFaultCountA;
    const sTotB = secondWinB + secondLoseB + doubleFaultCountB;
    const secWinRA = sTotA > 0 ? Math.round(secondWinA/sTotA*100) : 0;
    const secWinRB = sTotB > 0 ? Math.round(secondWinB/sTotB*100) : 0;
    const sgTotA = serviceGames.filter(i=>i.server==='A').length;
    const sgWinA = serviceGames.filter(i=>i.server==='A'&&i.winner==='A').length;
    const sgTotB = serviceGames.filter(i=>i.server==='B').length;
    const sgWinB = serviceGames.filter(i=>i.server==='B'&&i.winner==='B').length;
    const sgRA = sgTotA > 0 ? Math.round(sgWinA/sgTotA*100) : 0;
    const sgRB = sgTotB > 0 ? Math.round(sgWinB/sgTotB*100) : 0;
    const bpRA = breakPointTotalA > 0 ? Math.round(breakCountA/breakPointTotalA*100) : 0;
    const bpRB = breakPointTotalB > 0 ? Math.round(breakCountB/breakPointTotalB*100) : 0;
    const ttRA = thirtyThirtyOppA > 0 ? Math.round(thirtyThirtyWonA/thirtyThirtyOppA*100) : 0;
    const ttRB = thirtyThirtyOppB > 0 ? Math.round(thirtyThirtyWonB/thirtyThirtyOppB*100) : 0;
    const dcRA = deuceOppA > 0 ? Math.round(deuceWonA/deuceOppA*100) : 0;
    const dcRB = deuceOppB > 0 ? Math.round(deuceWonB/deuceOppB*100) : 0;
    const netTotA = netWonA + netLostA, netTotB = netWonB + netLostB;
    const netRA = netTotA > 0 ? Math.round(netWonA/netTotA*100) : 0;
    const netRB = netTotB > 0 ? Math.round(netWonB/netTotB*100) : 0;

    // 总得分
    let totA = 0, totB = 0;
    allSets.forEach(s => { totA += s.a; totB += s.b; });

    const W = 14; // 列宽
    const pad = (s, w) => String(s).padStart(w);
    const line = (label, a, b) => `  ${label.padEnd(12)}${pad(a,W)}${pad(b,W)}\n`;

    let text = '';
    text += `═══════════════════════════════════\n`;
    text += `  ${tr('copyTitle')}\n`;
    if (dateStr) text += `  ${tr('dateDisplay')}: ${dateStr}\n`;
    text += `${''.padEnd(35,'─')}\n`;
    text += `  ${tr('metric').padEnd(12)}${pad(playerAName,W)}${pad(playerBName,W)}\n`;
    text += `${''.padEnd(35,'─')}\n`;
    text += `${tr('score')}:\n${setsStr}`;
    text += `${''.padEnd(35,'─')}\n`;
    const S = tr('statsLabels');
    text += line(S.ace, aceCountA, aceCountB);
    text += line(S.doubleFault, doubleFaultCountA, doubleFaultCountB);
    text += line(S.winner, wA, wB);
    text += line(S.ue, ueA, ueB);
    text += line(S.net, netRA+'%'+'('+netWonA+'/'+netTotA+')', netRB+'%'+'('+netWonB+'/'+netTotB+')');
    text += line(S.firstIn, firstInRA+'%', firstInRB+'%');
    text += line(S.firstWin, firstWinRA+'%', firstWinRB+'%');
    text += line(S.secondWin, secWinRA+'%', secWinRB+'%');
    text += line(S.serviceGames, sgRA+'%'+'('+sgWinA+'/'+sgTotA+')', sgRB+'%'+'('+sgWinB+'/'+sgTotB+')');
    text += line(S.breakPoint, bpRA+'%'+'('+breakCountA+'/'+breakPointTotalA+')', bpRB+'%'+'('+breakCountB+'/'+breakPointTotalB+')');
    text += line(S.thirtyThirty, ttRA+'%'+'('+thirtyThirtyWonA+'/'+thirtyThirtyOppA+')', ttRB+'%'+'('+thirtyThirtyWonB+'/'+thirtyThirtyOppB+')');
    text += line(S.deucePoint, dcRA+'%'+'('+deuceWonA+'/'+deuceOppA+')', dcRB+'%'+'('+deuceWonB+'/'+deuceOppB+')');
    text += line(S.loveHold, loveHoldA, loveHoldB);
    text += line(S.loveBreak, loveBreakA, loveBreakB);
    text += line(S.total, totA, totB);
    text += `═══════════════════════════════════\n`;

    const btn = document.getElementById('copyStatsBtn');
    navigator.clipboard.writeText(text).then(() => {
        if (btn) { const orig = btn.innerText; btn.innerText = tr('copied'); setTimeout(() => btn.innerText = orig, 1800); }
    }).catch(() => {
        // 降级：textarea 方案
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); if (btn) { const orig = btn.innerText; btn.innerText = tr('copied'); setTimeout(() => btn.innerText = orig, 1800); } }
        catch(e) { alert(tr('copyFailed')); }
        document.body.removeChild(ta);
    });
}


// ── Scoreboard theme switcher ─────────────────────────────────
var currentTheme = 'atp';
var THEMES = ['atp','ao','rg','wim','uso'];
function setTheme(t) {
    if (!THEMES.includes(t)) return;
    var sb = document.getElementById('scoreboard');
    THEMES.forEach(function(th){ sb.classList.remove('theme-'+th); });
    sb.classList.add('theme-'+t);
    currentTheme = t;
    document.querySelectorAll('.theme-pill').forEach(function(p){ p.classList.remove('active'); });
    var pill = document.querySelector('.theme-pill.tp-'+t);
    if (pill) pill.classList.add('active');
}

// ── 保存当前比赛为一个可继续编辑的独立 HTML 文件 ─────────────────
function captureFullMatchState() {
    return {
        version: 1,
        savedAt: new Date().toISOString(),
        matchDate: document.getElementById('matchDate')?.value || '',
        matchMode: document.getElementById('matchMode')?.value || currentMatchMode,
        decidingSetRule,
        playerAName,
        playerBName,
        matchStarted,
        matchFinished,
        matchWinner,
        currentLanguage,
        currentTheme,
        currentStatsFilter,
        netStatsVisible,
        maxWins,
        useSuperTiebreakForDeciding,
        tiebreakTargetScore,
        snap: createSnap()
    };
}

function restoreFullMatchState(saved) {
    if (!saved || !saved.snap) return;
    currentLanguage = saved.currentLanguage || 'zh';
    currentTheme = saved.currentTheme || 'atp';
    currentStatsFilter = saved.currentStatsFilter ?? 'all';
    netStatsVisible = saved.netStatsVisible !== false;
    playerAName = saved.playerAName || tr('defaultPlayerA');
    playerBName = saved.playerBName || tr('defaultPlayerB');
    matchStarted = !!saved.matchStarted;
    matchFinished = !!saved.matchFinished;
    matchWinner = saved.matchWinner || null;
    currentMatchMode = saved.matchMode || 'custom';
    maxWins = saved.maxWins ?? 99;
    useSuperTiebreakForDeciding = !!saved.useSuperTiebreakForDeciding;
    decidingSetRule = saved.decidingSetRule || 'super';
    tiebreakTargetScore = saved.tiebreakTargetScore || 7;
    undoHistory = [];

    const pA = document.getElementById('pA');
    const pB = document.getElementById('pB');
    const matchDate = document.getElementById('matchDate');
    const matchMode = document.getElementById('matchMode');
    const ruleSelect = document.getElementById('decidingSetRule');
    if (pA) pA.value = playerAName;
    if (pB) pB.value = playerBName;
    if (matchDate) matchDate.value = saved.matchDate || '';
    if (matchMode) matchMode.value = currentMatchMode;
    if (ruleSelect) ruleSelect.value = decidingSetRule;

    restoreSnapExt(saved.snap);
    matchFinished = !!saved.matchFinished;
    matchWinner = saved.matchWinner || null;
    matchStarted = !!saved.matchStarted;
    currentStatsFilter = saved.currentStatsFilter ?? 'all';
    netStatsVisible = saved.netStatsVisible !== false;

    applyLanguage();
    setTheme(currentTheme);
    refreshAllNamesUI();
    applyNetStatsVisibility();
    updateFilterTabsUI();

    const setupBox = document.getElementById('setupBox');
    const scoreboard = document.getElementById('scoreboard');
    const ctrlWrap = document.getElementById('ctrlWrap');
    const themeSwitcher = document.getElementById('themeSwitcher');
    const continueBtn = document.getElementById('continueMatchBtn');
    const switchBtn = document.getElementById('switchToSetupBtn');
    if (matchStarted) {
        if (setupBox) setupBox.style.display = 'none';
        if (scoreboard) scoreboard.style.display = 'block';
        if (ctrlWrap) ctrlWrap.style.display = 'block';
        if (themeSwitcher) themeSwitcher.classList.add('visible');
        if (continueBtn) continueBtn.style.display = 'none';
        if (switchBtn) switchBtn.style.display = 'inline-block';
    } else {
        if (setupBox) setupBox.style.display = 'block';
        if (scoreboard) scoreboard.style.display = 'none';
        if (ctrlWrap) ctrlWrap.style.display = 'none';
        if (themeSwitcher) themeSwitcher.classList.remove('visible');
    }

    renderBoard();
    updateStats();
    refreshStatShow();
    updateStatsDateDisplay();

    const overlay = document.getElementById('winnerOverlay');
    if (overlay) {
        overlay.classList.remove('show');
        overlay.style.display = 'none';
    }
    const badge = document.getElementById('matchWinnerBadge');
    if (matchFinished && matchWinner) {
        if (badge) {
            badge.style.display = 'inline-block';
            badge.innerHTML = tr('winnerBadge')(matchWinner === 'A' ? playerAName : playerBName);
        }
        disableAllMatchControls(true);
    } else {
        if (badge) badge.style.display = 'none';
        disableAllMatchControls(false);
        syncPanelsByServer();
    }
}

function safeFilePart(text) {
    return String(text || '').trim().replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '') || 'Player';
}

function buildSavedMatchFileName() {
    let dateStr = document.getElementById('matchDate')?.value || new Date().toISOString().slice(0,10);
    dateStr = dateStr.replace(/-/g, '');
    return `${dateStr}_${safeFilePart(playerAName)}_vs_${safeFilePart(playerBName)}_比分记录.html`;
}

function saveMatchFile() {
    if (!matchStarted) {
        alert(tr('saveNeedStart'));
        return;
    }
    try {
        const saved = captureFullMatchState();
        const savedJson = JSON.stringify(saved).replace(/<\//g, '<\\/');
        let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        html = html.replace(/<script id="savedMatchState"[\s\S]*?<\/script>\s*/g, '');
        const restoreScript = `<script id="savedMatchState">\nwindow.__SAVED_MATCH_STATE__ = ${savedJson};\nif (typeof restoreFullMatchState === 'function') restoreFullMatchState(window.__SAVED_MATCH_STATE__);\n<\/script>\n`;
        html = html.replace('</body>', restoreScript + '</body>');
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = buildSavedMatchFileName();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        const btn = document.getElementById('saveMatchFileBtn');
        if (btn) {
            const orig = btn.innerText;
            btn.innerText = currentLanguage === 'en' ? 'Saved' : '已保存';
            setTimeout(() => btn.innerText = orig, 1800);
        }
    } catch (e) {
        alert(tr('saveFileFail'));
    }
}


// ════════════════════════════════════════════════════════════════
// 统计过滤器：全场 / 某盘
// ════════════════════════════════════════════════════════════════
var currentStatsFilter = 'all'; // 'all' | 0 | 1 | 2 ...

function captureStatsSnap() {
    // 捕获当前所有统计变量的快照（用于盘级别过滤）
    return {
        wA,wB,ueA,ueB,
        firstWinA,firstWinB,firstLoseA,firstLoseB,
        secondWinA,secondWinB,secondLoseA,secondLoseB,
        aceCountA,aceCountB,firstAceCountA,firstAceCountB,
        secondAceCountA,secondAceCountB,
        doubleFaultCountA,doubleFaultCountB,
        thirtyThirtyWonA,thirtyThirtyWonB,thirtyThirtyOppA,thirtyThirtyOppB,
        deuceWonA,deuceWonB,deuceOppA,deuceOppB,
        loveHoldA,loveHoldB,loveBreakA,loveBreakB,
        serveFaultCountA,serveFaultCountB,
        netWonA,netLostA,netWonB,netLostB,
        breakCountA,breakCountB,breakPointTotalA,breakPointTotalB,
        sgWinA: serviceGames.filter(i=>i.server==='A'&&i.winner==='A').length,
        sgTotA: serviceGames.filter(i=>i.server==='A').length,
        sgWinB: serviceGames.filter(i=>i.server==='B'&&i.winner==='B').length,
        sgTotB: serviceGames.filter(i=>i.server==='B').length,
        currentSetPointsA, currentSetPointsB
    };
}

function getFilteredStats() {
    // Returns stats object for the current filter
    if (currentStatsFilter === 'all') {
        return captureStatsSnap();
    }
    var idx = currentStatsFilter; // 0-based set index
    if (idx < 0 || idx >= setList.length) return captureStatsSnap();

    var cur = setList[idx].stats || captureStatsSnap();
    var prev = idx > 0 ? (setList[idx-1].stats || null) : null;

    function d(a, b) { return (a || 0) - (b || 0); }
    if (!prev) return cur;
    return {
        wA: d(cur.wA, prev.wA), wB: d(cur.wB, prev.wB),
        ueA: d(cur.ueA, prev.ueA), ueB: d(cur.ueB, prev.ueB),
        firstWinA: d(cur.firstWinA,prev.firstWinA), firstWinB: d(cur.firstWinB,prev.firstWinB),
        firstLoseA: d(cur.firstLoseA,prev.firstLoseA), firstLoseB: d(cur.firstLoseB,prev.firstLoseB),
        secondWinA: d(cur.secondWinA,prev.secondWinA), secondWinB: d(cur.secondWinB,prev.secondWinB),
        secondLoseA: d(cur.secondLoseA,prev.secondLoseA), secondLoseB: d(cur.secondLoseB,prev.secondLoseB),
        aceCountA: d(cur.aceCountA,prev.aceCountA), aceCountB: d(cur.aceCountB,prev.aceCountB),
        firstAceCountA: d(cur.firstAceCountA,prev.firstAceCountA), firstAceCountB: d(cur.firstAceCountB,prev.firstAceCountB),
        secondAceCountA: d(cur.secondAceCountA,prev.secondAceCountA), secondAceCountB: d(cur.secondAceCountB,prev.secondAceCountB),
        doubleFaultCountA: d(cur.doubleFaultCountA,prev.doubleFaultCountA), doubleFaultCountB: d(cur.doubleFaultCountB,prev.doubleFaultCountB),
        thirtyThirtyWonA: d(cur.thirtyThirtyWonA,prev.thirtyThirtyWonA), thirtyThirtyWonB: d(cur.thirtyThirtyWonB,prev.thirtyThirtyWonB),
        thirtyThirtyOppA: d(cur.thirtyThirtyOppA,prev.thirtyThirtyOppA), thirtyThirtyOppB: d(cur.thirtyThirtyOppB,prev.thirtyThirtyOppB),
        deuceWonA: d(cur.deuceWonA,prev.deuceWonA), deuceWonB: d(cur.deuceWonB,prev.deuceWonB),
        deuceOppA: d(cur.deuceOppA,prev.deuceOppA), deuceOppB: d(cur.deuceOppB,prev.deuceOppB),
        loveHoldA: d(cur.loveHoldA,prev.loveHoldA), loveHoldB: d(cur.loveHoldB,prev.loveHoldB),
        loveBreakA: d(cur.loveBreakA,prev.loveBreakA), loveBreakB: d(cur.loveBreakB,prev.loveBreakB),
        serveFaultCountA: d(cur.serveFaultCountA,prev.serveFaultCountA), serveFaultCountB: d(cur.serveFaultCountB,prev.serveFaultCountB),
        netWonA: d(cur.netWonA,prev.netWonA), netLostA: d(cur.netLostA,prev.netLostA),
        netWonB: d(cur.netWonB,prev.netWonB), netLostB: d(cur.netLostB,prev.netLostB),
        breakCountA: d(cur.breakCountA,prev.breakCountA), breakCountB: d(cur.breakCountB,prev.breakCountB),
        breakPointTotalA: d(cur.breakPointTotalA,prev.breakPointTotalA), breakPointTotalB: d(cur.breakPointTotalB,prev.breakPointTotalB),
        sgWinA: d(cur.sgWinA,prev.sgWinA), sgTotA: d(cur.sgTotA,prev.sgTotA),
        sgWinB: d(cur.sgWinB,prev.sgWinB), sgTotB: d(cur.sgTotB,prev.sgTotB),
        // 当前盘总得分本身就是盘内数据，不是累计值，不能减去上一盘；否则单盘统计可能出现负数
        currentSetPointsA: cur.currentSetPointsA || 0,
        currentSetPointsB: cur.currentSetPointsB || 0
    };
}

function setStatsFilter(f) {
    currentStatsFilter = f;
    updateFilterTabsUI();
    renderAtpPanel();
}

function updateFilterTabsUI() {
    // Rebuild the filter tabs based on completed sets + current set
    var bar = document.getElementById('statsFilterBar');
    if (!bar) return;
    var completedSets = setList.length;
    var hasCurrentSet = (gA > 0 || gB > 0 || currentSetPointsA > 0 || currentSetPointsB > 0) && !matchFinished;
    // Build tabs
    var html = '<button class="filter-tab' + (currentStatsFilter === 'all' ? ' active' : '') + '" id="filterTabAll" onclick="setStatsFilter(&apos;all&apos;)">'+tr('all')+'</button>';
    for (var i = 0; i < completedSets; i++) {
        var active = currentStatsFilter === i ? ' active' : '';
        html += '<button class="filter-tab' + active + '" onclick="setStatsFilter(' + i + ')">'+tr('setN')(i+1)+'</button>';
    }
    bar.innerHTML = html;
    // Update header center
    var center = document.getElementById('atpPanelCenter');
    if (center) {
        if (currentStatsFilter === 'all') center.textContent = tr('stats');
        else center.textContent = tr('setN')(currentStatsFilter+1);
    }
}

// ════════════════════════════════════════════════════════════════
// 结束比赛功能
// ════════════════════════════════════════════════════════════════
var _preEndSnap = null;

function endMatchManually() {
    if (matchFinished) return;
    if (!matchStarted) return;
    if (!confirm(tr('confirmEndMatch'))) return;

    // Save snap for undo
    saveSnap();
    _preEndSnap = snap;

    // Determine winner from current sets won, fall back to current game score
    var sw = getSetsWon();
    var winner = null;
    if (sw.winsA > sw.winsB) winner = 'A';
    else if (sw.winsB > sw.winsA) winner = 'B';
    else {
        // Same sets won — decide by current game score
        if (gA > gB) winner = 'A';
        else if (gB > gA) winner = 'B';
        else {
            // Same games — decide by current point score
            if (pA > pB || tieA > tieB) winner = 'A';
            else if (pB > pA || tieB > tieA) winner = 'B';
            else winner = 'A'; // truly equal, default to A (edge case)
        }
    }

    matchFinished = true;
    matchWinner = winner;

    // Build score summary  e.g. "6-4  3-6  6-3"
    var scoreStr = setList.map(function(s){ return s.a + '-' + s.b; }).join('  ');
    if (gA > 0 || gB > 0) {
        if (scoreStr) scoreStr += '  ';
        scoreStr += gA + '-' + gB + ' *';
    }

    // Show modal
    showWinnerModal(winner, scoreStr);

    // Disable controls
    disableAllMatchControls(true);

    // Update badge
    var badge = document.getElementById('matchWinnerBadge');
    if (badge) {
        badge.style.display = 'inline-block';
        var winnerName = winner === 'A' ? playerAName : playerBName;
        badge.innerHTML = tr('winnerBadge')(winnerName);
    }
}

function showWinnerModal(winner, scoreStr) {
    var winnerName = winner === 'A' ? playerAName : playerBName;
    document.getElementById('winnerNameDisplay').textContent = tr('winnerText')(winnerName);
    document.getElementById('winnerScoreDisplay').textContent = scoreStr || '';

    var overlay = document.getElementById('winnerOverlay');
    overlay.style.display = 'flex';
    // Trigger animation on next frame
    requestAnimationFrame(function(){
        requestAnimationFrame(function(){
            overlay.classList.add('show');
        });
    });
}

function closeWinnerModal() {
    var overlay = document.getElementById('winnerOverlay');
    overlay.classList.remove('show');
    setTimeout(function(){ overlay.style.display = 'none'; }, 350);
}

function undoEndMatch() {
    closeWinnerModal();
    // Give modal time to close, then restore
    setTimeout(function(){
        if (_preEndSnap) {
            restoreSnapExt(_preEndSnap);
            _preEndSnap = null;
            matchFinished = false;
            matchWinner = null;
            resetMatchFinishedFlag();
            renderBoard();
            updateStats();
            syncPanelsByServer();
        }
    }, 120);
}

function safeAbortRecording() { if(isRecording) stopRecordingAndSave(false); }
document.body.addEventListener('touchmove', function(e) { let scrollTop = document.documentElement.scrollTop || document.body.scrollTop; let deltaY = e.touches[0].clientY; if ((scrollTop <= 0 && deltaY > 0) || (document.body.scrollHeight - window.innerHeight - scrollTop <= 1 && deltaY < 0)) { e.preventDefault(); } }, { passive: false });
document.getElementById('fontMinusBtn')?.addEventListener('click', () => changeStatsFontSize(-1));
document.getElementById('fontPlusBtn')?.addEventListener('click', () => changeStatsFontSize(1));
applyStatsFontSize();
setDefaultDateToday();
applyLanguage();
</script>
